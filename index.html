<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mango Collage</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-pattern" patternUnits="userSpaceOnUse">
          <path class="grid-line" fill="none" stroke-width="1" />
        </pattern>
      </defs>
      <rect id="grid-bg" x="0" y="0" width="100%" height="100%" fill="url(#grid-pattern)"></rect>
      <g id="world"></g>
    </svg>

    <div id="menu-container">
      <button id="menu-button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <line x1="4" y1="6" x2="20" y2="6" stroke="#444" stroke-width="2" stroke-linecap="round" />
          <line x1="4" y1="12" x2="20" y2="12" stroke="#444" stroke-width="2" stroke-linecap="round" />
          <line x1="4" y1="18" x2="20" y2="18" stroke="#444" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="menu-dropdown" class="popup-menu" role="menu" hidden>
        <button id="menu-new" role="menuitem">New</button>
        <button id="menu-open" role="menuitem">Open</button>
        <button id="menu-add" role="menuitem">Add</button>
        <button id="menu-export-svg" role="menuitem">Export SVG</button>
        <button id="menu-export-zip" role="menuitem">Export ZIP</button>
      </div>
      <input id="file-input" type="file" accept="image/svg+xml" hidden />
      <input id="open-input" type="file" accept=".svg,.zip,image/svg+xml,application/zip" hidden />
      <input id="replace-input" type="file" accept="image/svg+xml" hidden />
    </div>

    <div id="shape-context-menu" class="popup-menu" role="menu" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
